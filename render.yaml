# Render Blueprint (Infrastructure-as-Code).
# Deploy by pointing Render at this repo:  New + -> Blueprint -> pick repo.
# Docs: https://render.com/docs/blueprint-spec
#
# ONE free Docker web service that serves both the API (/api/*) and the SPA.
services:
  - type: web
    name: retail-analytics
    runtime: docker
    plan: free                 # free instance type
    # region: singapore        # uncomment the region closest to you (default: oregon)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true           # redeploy automatically on every git push
    envVars:
      # Random secret used to sign session cookies - generated once by Render.
      - key: AUTH_SECRET_KEY
        generateValue: true
      # Marks the deployment as HTTPS so the session cookie is flagged `secure`.
      - key: ENVIRONMENT
        value: production
      # First ADMIN created automatically the first time the (ephemeral) auth
      # database is created, with the password below.
      - key: INITIAL_ADMIN_EMAIL
        value: mis@adonisgroup.in
      # Password for that initial admin (email + password login).
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Same-origin app, so CORS is only a safety net.
      - key: CORS_ORIGINS
        value: "*"
      # --- Google OAuth (disabled while password login is in use) ---
      # Uncomment these three (and re-enable the Google button on the login
      # page) to switch back to "Sign in with Google".
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # - key: GOOGLE_REDIRECT_URI
      #   sync: false
